<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS falls back to a screenshot of the page unless a PNG is offered here. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://softn.com/" />
    <meta name="theme-color" content="#101317" />
    <!--
      Runs before the first paint so a light-mode reader never sees the dark
      ground flash first. It duplicates the key and the resolution rule from
      src/lib/theme.ts on purpose: the module cannot help here, because by the
      time the bundle has loaded the wrong colours are already on screen.
    -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('softn.site.theme');
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            theme = 'light';
          }
        } catch (e) {
          /* Storage blocked; the dark default stands. */
        }
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'light') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f4f6f9');
        }
      })();
    </script>
    <title>SoftN — a UI language and its runtime</title>
    <meta
      name="description"
      content="SoftN turns a .ui file into a working application: 86 components, a sandboxed JavaScript engine compiled to WebAssembly, and a local-first database that syncs peer to peer."
    />
    <meta property="og:title" content="SoftN — a UI language and its runtime" />
    <meta
      property="og:description"
      content="Write the interface. It's already running. A UI language, a sandboxed JavaScript engine and a local-first database, in a browser tab."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SoftN" />
    <meta property="og:url" content="https://softn.com/" />
    <!-- Absolute, not root-relative: a scraper resolves this without a base, and
         a relative og:image is the usual reason a shared link unfurls bare.
         public/og.png is generated by scripts/generate-icons.mjs. -->
    <meta property="og:image" content="https://softn.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SoftN — a UI language, and the runtime that runs it." />
    <!-- Twitter reads the og:* tags for everything else, but only once this
         one tells it the card is a large-image card. -->
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
