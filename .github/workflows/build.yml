name: Build SoftN

# Manual-only for now, as requested — but the reason it was disabled is gone.
# It used to compile the FormLogic engine from a separate repository and copy it
# into core; that engine is no longer loaded, and the one that is lives at
# packages/@softn/core/wasm-zipp/, committed. So this now runs the checks worth
# running instead. Put it back on every push and PR by swapping the trigger for
# the block commented out below.
on:
  workflow_dispatch:
#  push:
#    branches: [main]
#  pull_request:
#    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # `npm ci` installs exactly what package-lock.json pins and fails loudly if
      # the lockfile has drifted, which is the whole point of running it in CI.
      # It replaces `npm install --legacy-peer-deps`: the peer conflicts that
      # flag existed for are resolved, and installing without the lockfile meant
      # CI silently tested a different dependency set than anyone else runs.
      - name: Install dependencies
        run: npm ci

      # Include development tooling: the lockfile is part of the shipped build
      # pipeline, and vulnerable parsers/globbers there can still process
      # attacker-controlled repository content.
      - name: Audit dependency lockfile
        run: npm audit --audit-level=high

      # The scripting engine is committed at packages/@softn/core/wasm-zipp/,
      # so there is nothing to compile first and no Rust toolchain needed.
      # build:packages builds core, then components, then vite-plugin — in that
      # order, because each needs the one before it to have emitted its types.
      - name: Build packages
        run: npm run build:packages

      # Production bundling catches configuration, PWA and asset-pipeline
      # failures that TypeScript and unit tests cannot. This also covers Studio
      # and the marketing site, which have no platform-specific matrix job.
      - name: Build browser applications
        run: npm run build:apps

      - name: Typecheck
        run: npm run typecheck

      # `lint` is the stricter aspiration (--max-warnings 0); the tree carries
      # several hundred deliberate `no-console` warnings, so CI gates on errors.
      - name: Lint
        run: npm run lint:errors

      - name: Test
        run: npm test
  build-web:
    name: Build Web Runtime
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: |
          npm run build:packages
          npm run build -w @softn/web

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: softn-web
          path: apps/softn-web/dist/
          retention-days: 7

  build-tauri:
    name: Build ${{ matrix.app }} (${{ matrix.platform }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: softn-loader
            platform: ubuntu-22.04
          - app: softn-loader
            platform: windows-latest
          - app: softn-loader
            platform: macos-latest
          - app: softn-builder
            platform: ubuntu-22.04
          - app: softn-builder
            platform: windows-latest
          - app: softn-builder
            platform: macos-latest
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned xdb.org dependency
        if: matrix.app == 'softn-loader'
        run: bash .github/scripts/checkout-xdb.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/${{ matrix.app }}/src-tauri/target/
          key: tauri-${{ matrix.app }}-${{ matrix.platform }}-${{ hashFiles('apps/**/Cargo.lock') }}
          restore-keys: tauri-${{ matrix.app }}-${{ matrix.platform }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:packages

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/${{ matrix.app }}
          # Skip Tauri's built-in DMG bundling on macOS — bundle_dmg.sh fails
          # on headless CI runners. We create the DMG manually in the next step.
          args: ${{ startsWith(matrix.platform, 'macos') && '--bundles app' || '' }}

      - name: Create DMG (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          APP_DIR="apps/${{ matrix.app }}/src-tauri/target/release/bundle/macos"
          DMG_DIR="apps/${{ matrix.app }}/src-tauri/target/release/bundle/dmg"
          mkdir -p "$DMG_DIR"
          APP_PATH=$(find "$APP_DIR" -maxdepth 1 -name "*.app" | head -1)
          APP_NAME=$(basename "$APP_PATH" .app)
          hdiutil create -volname "$APP_NAME" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_DIR/$APP_NAME.dmg"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ matrix.platform }}
          path: |
            apps/${{ matrix.app }}/src-tauri/target/release/bundle/**/*.exe
            apps/${{ matrix.app }}/src-tauri/target/release/bundle/**/*.msi
            apps/${{ matrix.app }}/src-tauri/target/release/bundle/**/*.dmg
            apps/${{ matrix.app }}/src-tauri/target/release/bundle/**/*.AppImage
            apps/${{ matrix.app }}/src-tauri/target/release/bundle/**/*.deb
          retention-days: 7
