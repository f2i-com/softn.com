<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Visual editor for SoftN applications" />
    <!-- The colour the browser paints around the app, which has to be the colour
         the app actually is. This said #0c0a09 — a near-black — above a light
         chrome, so the window furniture belonged to a different application. -->
    <meta name="theme-color" content="#f4f6f9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- The apple- prefixed form is the deprecated spelling, kept because iOS Safari still
         only honours that one for standalone display. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <title>SoftN Builder</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body, #root {
        height: 100%;
        overflow: hidden;
      }
      :root {
        --b-display: 'Bricolage Grotesque Variable', 'Bricolage Grotesque', system-ui, sans-serif;
        --b-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --b-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      body {
        font-family: var(--b-body);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: #f4f6f9;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
