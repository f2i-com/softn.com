[package]
name = "softn-builder"
version = "0.0.9"
description = "SoftN Application Builder IDE"
authors = ["SoftN Team"]
license = "Apache-2.0"
repository = ""
edition = "2021"

[lib]
name = "softn_builder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# GTK 3 requires glib 0.18; this vendor backports RUSTSEC-2024-0429.
[patch.crates-io]
glib = { path = "../../../vendor/glib" }
