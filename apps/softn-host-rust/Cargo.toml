[package]
name = "softn-server"
version = "0.0.15"
edition = "2021"
license = "Apache-2.0"

[dependencies]
# The JavaScript engine `.logic` runs on, taken from ZIPP's release tag. The
# tag is the repository's declared ZIPP release: fetch-zipp-release.mjs installs
# the browser engine (packages/@softn/core/wasm-zipp/, generated) from the same
# release and scripts/engine-pin.test.mjs holds Cargo.lock to its commit, so
# the host and the browser run one engine and ZIPP need not be checked out
# beside this repository (XDB, below, still does). When ZIPP releases, bump the tag and Cargo.lock
# together; a SoftN release refuses an older one (scripts/zipp-release-gate.mjs)
# unless told otherwise. To develop against a sibling checkout
# instead: cargo test --config 'patch."https://github.com/f2i-com/zipp.org".zipp-vm.path="../../../zipp.org/crates/zipp-vm"'
# `instrument` is what gives the server a step budget and a cooperative
# abort flag for untrusted scripts; it switches the JIT off, which is the
# price of the budget being real.
zipp-vm = { git = "https://github.com/f2i-com/zipp.org", tag = "v0.0.21", features = ["instrument"] }
xdb = { path = "../../../xdb.org/crates/xdb", default-features = false }

axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "timeout"] }
# A connection loop of our own (http::serve_router) so hyper gets a timer:
# axum::serve builds connections without one, which leaves the header-read
# timeout off. Versions are the ones axum already brings in.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service", "http1"] }
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
ureq = "3"
chrono = "0.4"
futures-util = "0.3"
dirs = "6"
crossbeam-channel = "0.5"
subtle = "2"
r2d2 = "0.8"
r2d2_sqlite = "0.24"
rusqlite = { version = "0.31", features = ["bundled", "hooks", "limits"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10.9"
hmac = "0.12"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
chrono-tz = "0.10"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
