[package]
name = "softn-loader"
version = "0.0.17"
description = "SoftN Application Runtime"
authors = ["SoftN Team"]
license = "Apache-2.0"
repository = ""
edition = "2021"

[lib]
name = "softn_loader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "image-ico"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg"] }
# `softn.net.fetch` and remote imports, made here rather than by the webview so
# its CSP need not open `connect-src` to every host (see net.rs).
reqwest = "0.13"
url = "2"

# XDB P2P Database
xdb = { path = "../../../../xdb.org/crates/xdb" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Android has no platform verifier without JNI set-up; net.rs trusts the
# Mozilla roots there instead.
[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-cli = "2"

# GTK 3 requires glib 0.18; this vendor backports RUSTSEC-2024-0429.
[patch.crates-io]
glib = { path = "../../../vendor/glib" }

# Debug builds always have the web inspector. Release builds get it only when
# asked for: `cargo tauri build -- --features devtools`; a shipped binary
# should not open an inspector over a bundle with Ctrl+Shift+I.
[features]
devtools = ["tauri/devtools"]
