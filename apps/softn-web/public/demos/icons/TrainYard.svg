<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Track ties -->
  <rect x="8" y="52" width="48" height="4" rx="2" fill="#78350f"/>
  <rect x="12" y="48" width="40" height="2" rx="1" fill="#94a3b8"/>
  <!-- Locomotive body -->
  <rect x="14" y="24" width="30" height="18" rx="3" fill="#334155"/>
  <rect x="12" y="38" width="36" height="6" rx="2" fill="#1e293b"/>
  <!-- Cab -->
  <rect x="36" y="16" width="16" height="24" rx="3" fill="url(#red)"/>
  <rect x="40" y="20" width="8" height="8" rx="1" fill="#bae6fd"/>
  <!-- Boiler & Smokestack -->
  <path d="M 14 24 Q 14 18 20 18 L 36 18 L 36 24 Z" fill="#475569"/>
  <rect x="18" y="10" width="6" height="10" rx="1" fill="#1e293b"/>
  <path d="M 16 10 L 26 10 L 24 13 L 18 13 Z" fill="url(#gold)"/>
  <!-- Headlight beam -->
  <polygon points="12,28 2,22 2,36 12,30" fill="#fef08a" opacity="0.35"/>
  <circle cx="12" cy="29" r="2.5" fill="#fef08a"/>
  <!-- Steam puffs -->
  <circle cx="15" cy="7" r="3" fill="#f1f5f9" opacity="0.7"/>
  <circle cx="10" cy="5" r="4" fill="#f1f5f9" opacity="0.5"/>
  <circle cx="6" cy="3" r="5" fill="#f1f5f9" opacity="0.3"/>
  <!-- Wheels -->
  <circle cx="18" cy="46" r="5.5" fill="#0f172a" stroke="url(#gold)" stroke-width="2"/>
  <circle cx="30" cy="46" r="5.5" fill="#0f172a" stroke="url(#gold)" stroke-width="2"/>
  <circle cx="44" cy="46" r="5.5" fill="#0f172a" stroke="url(#gold)" stroke-width="2"/>
  <!-- Side rod -->
  <rect x="18" y="45" width="26" height="2.5" rx="1" fill="#e2e8f0"/>
</svg>
