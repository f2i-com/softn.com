name: Verify

# The one verification, shared by every workflow that needs to know a commit
# is good: the push/PR checks (ci.yml), the hand-dispatched full build
# (build.yml) and the tag release (release.yml) all call this rather than
# carrying their own copy of the steps. A release used to run its own shorter
# list — install, audit, licences, build the site — so a tag could package a
# commit that had never been typechecked, linted or tested as that exact
# commit; the checks on main had run on whatever main was when it was pushed,
# which is not always the tagged commit. Factoring the steps here means
# "verified" means the same thing on every path, and the release job cannot
# start until it holds.
#
# The work is spread over jobs that run side by side, and a caller waits for
# all of them: the build, typecheck and lint; the test suites, cut into four
# shards by scripts/checks/test-shards.mjs (every workspace suite, every root test
# pattern and core's suite on the host JavaScript engine, each in exactly one
# shard, which scripts/checks/test-shards.test.mjs holds); the XDB crate; the Rust
# backend host; the runner without Node; the desktop loader's and the Builder's
# Rust sides; and on Windows, the runner as Windows ships it and the loader's
# shell extension. One job ran all of it in a
# row, eleven minutes, most of it the suites one after another.
#
# `ref` is what to verify. Empty means the ref that triggered the caller,
# which is what a push or pull request wants; a release passes its tag so the
# exact tagged commit is what is checked out, built and tested.
#
# `zipp-release` and `zipp-sums-sha256` are the ZIPP release a release run's
# gate froze, and the digest its SHA256SUMS must have. Empty means the release
# apps/softn-host-rust/Cargo.toml declares, which is what every other caller
# wants: a commit builds against the same ZIPP whenever it is verified.
on:
  workflow_call:
    inputs:
      ref:
        description: The git ref to verify; the caller's own ref when empty
        required: false
        type: string
        default: ''
      zipp-release:
        description: The ZIPP release to install (vX.Y.Z); the Cargo.toml zipp-vm tag when empty
        required: false
        type: string
        default: ''
      zipp-sums-sha256:
        description: The sha256 that release's SHA256SUMS must have; unchecked when empty
        required: false
        type: string
        default: ''

# Every job reads the repository and nothing else; the token is held to that
# here, not by the repository's default setting alone.
permissions:
  contents: read

jobs:
  checks:
    name: Build, typecheck and lint
    runs-on: ubuntu-latest
    # Read by every install of the engine in this job, the npm hooks' included.
    env:
      ZIPP_RELEASE: ${{ inputs.zipp-release }}
      ZIPP_SUMS_SHA256: ${{ inputs.zipp-sums-sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins and fails loudly if
      # the lockfile has drifted, which is the whole point of running it in CI.
      # It replaces `npm install --legacy-peer-deps`: the peer conflicts that
      # flag existed for are resolved, and installing without the lockfile meant
      # CI silently tested a different dependency set than anyone else runs.
      - name: Install dependencies
        run: npm ci

      # The scripting engine is not in this repository either: the ZIPP release
      # the Cargo tag names (or the one a release froze) is installed into
      # packages/@softn/core/wasm-zipp/ and verified against that release's
      # SHA256SUMS. The build, test, typecheck and licence hooks would install
      # it too; this step makes it visible and fails first if it cannot.
      - name: Install the ZIPP release
        run: node packages/@softn/core/scripts/fetch-zipp-release.mjs --ensure

      # The web app's build carries the pinned demo bundles, as it does
      # everywhere else (see the test shards below for where they come from).
      - name: Fetch the demo bundles
        run: npm run fetch:demos

      # Include development tooling: the lockfile is part of the shipped build
      # pipeline, and vulnerable parsers/globbers there can still process
      # attacker-controlled repository content.
      - name: Audit dependency lockfile
        run: npm audit --audit-level=high

      # The engine is fetched from the ZIPP release the Cargo tag names, already
      # built, so there is nothing to compile first and no Rust toolchain.
      # build:packages builds core, then components, then vite-plugin — in that
      # order, because each needs the one before it to have emitted its types.
      - name: Build packages
        run: npm run build:packages

      # Production bundling catches configuration, PWA and asset-pipeline
      # failures that TypeScript and unit tests cannot. This also covers Studio
      # and the marketing site, which have no platform-specific matrix job.
      - name: Build browser applications
        run: npm run build:apps

      - name: Typecheck
        run: npm run typecheck

      # `lint` runs with --max-warnings 0 (the root package.json): the tree has
      # no warnings, so a change that adds one fails here. Tests and the CLI
      # are exempt from no-console and no-explicit-any (.eslintrc.cjs overrides).
      - name: Lint
        run: npm run lint

  # Every suite, in four shards. Which suites a shard runs, and what it has to
  # build or install first, is scripts/checks/test-shards.mjs's answer for that shard;
  # among them is core's suite a second time, with @softn/core/host-js behind
  # the engine seam instead of ZIPP (`test:host-js`). That engine runs an app
  # author's code as the host document's own JavaScript, with no VM around it,
  # for accounts a host has verified — so a divergence from what the runtime
  # expects of the seam is not a wrong answer in a sandbox, it is a wrong
  # answer in a frame that contains nothing. The targeted tests cannot find
  # that class of fault; running the whole suite on the engine can, and does
  # (removing the host adapter's value projection fails
  # `state-sync-array-fidelity.test.ts`, which was written years before this
  # engine existed). It runs here, on the push/PR path as well as the release
  # one, so a divergence is caught at the commit that introduced it.
  test:
    name: Test (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    strategy:
      # One shard failing says nothing about the others; let each finish.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      ZIPP_RELEASE: ${{ inputs.zipp-release }}
      ZIPP_SUMS_SHA256: ${{ inputs.zipp-sums-sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the ZIPP release
        run: node packages/@softn/core/scripts/fetch-zipp-release.mjs --ensure

      # The demo bundles are not in this repository: their sources live in
      # f2i-com/softn-Examples, whose releases publish the archives, and
      # apps/softn-web/public/demos/index.json pins one by URL, size and digest.
      # The directory API's tests seed from them, so they are fetched and
      # verified against their digests here.
      - name: Fetch the demo bundles
        run: npm run fetch:demos

      # The suites import core and components from dist/.
      - name: Build packages
        run: npm run build:packages

      - name: What this shard needs
        id: needs
        run: node scripts/checks/test-shards.mjs --shard ${{ matrix.shard }}/4 --needs >> "$GITHUB_OUTPUT"

      # scripts/checks/host-js-isolation.test.mjs looks inside the built Builder,
      # Studio and web app, and skips what is not built.
      - name: Build browser applications for the tests that read them
        if: steps.needs.outputs.apps == 'true'
        run: npm run build:apps

      # scripts/dev/dev-service-worker.test.mjs drives a real Chromium through a
      # stale service worker; it skips itself when no browser is installed,
      # so this is what makes it run here rather than pass by skipping. The
      # browser is kept between runs for the Playwright version the lockfile
      # pins: downloading it every time cost the shard 20 seconds, and a run
      # failed when Playwright's CDN answered with another site's certificate.
      # The system libraries it needs are installed every time either way.
      - name: Which Playwright the lockfile pins
        if: steps.needs.outputs.chromium == 'true'
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Keep Playwright's Chromium between runs
        if: steps.needs.outputs.chromium == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium for the browser-driven script tests
        if: steps.needs.outputs.chromium == 'true'
        run: npx playwright install --with-deps chromium

      # The runner image ships PHP, so the directory API's and the PHP host's
      # suites run here rather than being skipped. A shard's tests take about
      # three minutes; a test that hangs (a loop no engine stops, a promise
      # nothing settles: node --test has no timeout of its own) fails the
      # shard at fifteen rather than holding it for GitHub's six hours.
      - name: Test
        timeout-minutes: 15
        run: node scripts/checks/test-shards.mjs --shard ${{ matrix.shard }}/4

  # The XDB crate (crates/softn-xdb), which the backend host and the desktop
  # loader are both built on. It is a Rust crate outside the npm workspaces
  # with its own lockfile, so nothing else runs its suite. It runs without the
  # Tauri commands, the way the backend host uses it, so it needs no Node and
  # no system libraries; the loader job below compiles the commands.
  xdb:
    name: Test the XDB crate (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Rust toolchain for the XDB crate
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the stable branch, 2026-10-16
        with:
          toolchain: stable
      - name: Cache Cargo for the XDB crate
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            crates/softn-xdb/target/
          key: xdb-${{ runner.os }}-${{ hashFiles('crates/softn-xdb/Cargo.lock') }}
          # A changed lock starts from the last build rather than from nothing,
          # as the loader's cache below does; Cargo rebuilds what changed.
          restore-keys: xdb-${{ runner.os }}-
      - name: Test the XDB crate
        run: cargo test --no-default-features --locked --manifest-path crates/softn-xdb/Cargo.toml

  # The private backend host is Rust and lives outside the npm workspaces;
  # nothing else runs its tests, and they need no Node. XDB comes from this
  # repository (crates/softn-xdb, a path dependency) and the ZIPP engine from
  # ZIPP's release tag through Cargo itself, so the checkout is all it needs.
  host-rust:
    name: Test the private backend host (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Rust toolchain for the private backend host
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the stable branch, 2026-10-16
        with:
          toolchain: stable
      - name: Cache Cargo for the private backend host
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/softn-host-rust/target/
          key: host-rust-${{ runner.os }}-${{ hashFiles('apps/softn-host-rust/Cargo.lock') }}
          restore-keys: host-rust-${{ runner.os }}-
      - name: Test the private backend host
        run: cargo test --locked --manifest-path apps/softn-host-rust/Cargo.toml

  # softn-runner (apps/softn-runner): an app's private server logic without
  # Node, the ZIPP engine compiled to WebAssembly and run under wasmtime. Built
  # as a release carries it (static Linux, musl) and held to the Node runner's
  # own suite, which runs the binary when SOFTN_TEST_RUNNER names it. Its guest
  # is built from the ZIPP tag the engine install names, so that install comes
  # first (build.mjs refuses any other commit).
  runner:
    name: Build and test the runner without Node (Rust)
    runs-on: ubuntu-latest
    env:
      ZIPP_RELEASE: ${{ inputs.zipp-release }}
      ZIPP_SUMS_SHA256: ${{ inputs.zipp-sums-sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      # Node runs build.mjs, the engine install and the suite; the install
      # reads the release's archives with an npm package (fflate).
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install the ZIPP release
        run: node packages/@softn/core/scripts/fetch-zipp-release.mjs --ensure
      # Each crate brings its own toolchain (rust-toolchain.toml: the guest's
      # 1.92.0 with wasm32-wasip1, the runner's 1.99.0); the runner's static
      # Linux target and musl's C compiler, for SQLite and wasmtime's helpers,
      # are added here.
      # php-cgi too: the PHP host's own suite puts requests through http.php
      # to the runner it chooses (below).
      - name: The static Linux target
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools php-cli php-cgi
          cd apps/softn-runner/host && rustup target add x86_64-unknown-linux-musl
      - name: Cache Cargo for the runner
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/softn-runner/guest/target/
            apps/softn-runner/host/target/
          key: runner-${{ runner.os }}-${{ hashFiles('apps/softn-runner/guest/Cargo.lock', 'apps/softn-runner/host/Cargo.lock') }}
          restore-keys: runner-${{ runner.os }}-
      - name: Build the runner
        run: node apps/softn-runner/build.mjs --target x86_64-unknown-linux-musl
      # From the crate's folder, so its rust-toolchain.toml chooses the
      # compiler, as for the build above: from the root it was the image's
      # stable, which tested on another rustc and compiled everything twice.
      - name: Test the runner's own parts
        working-directory: apps/softn-runner/host
        run: cargo test --release --locked
      - name: The Node runner's suite, on the runner
        env:
          SOFTN_TEST_RUNNER: ${{ github.workspace }}/apps/softn-runner/dist/softn-runner-linux-x86_64
        run: node --test apps/softn-host-php/tests/route-declarations.test.mjs
      # The PHP host from php-cgi to the runner and back: on softn-runner, with
      # no Node in the backend, and which runner http.php and setup.php choose
      # where both are there; then the same on Node, where nothing else in CI
      # has php-cgi to run it.
      - name: The PHP host's requests, on the runner and on Node
        env:
          RUNNER: ${{ github.workspace }}/apps/softn-runner/dist/softn-runner-linux-x86_64
        run: |
          SOFTN_TEST_RUNNER="$RUNNER" node --test apps/softn-host-php/tests/http-runner.test.mjs
          node --test apps/softn-host-php/tests/http-runner.test.mjs apps/softn-host-php/tests/request.test.mjs

  # The desktop loader's Rust side, with XDB's Tauri commands compiled in (the
  # XDB job above tests the crate without them), so a change that breaks those
  # commands or the loader's use of them is seen on every push rather than on
  # the next dispatched six-runner build. Its tests, not only a check: they
  # drive the loader's commands through Tauri's mock IPC (tests/page_calls.rs
  # and the unit tests beside each module), and need no window or bundle.
  loader:
    name: Test the desktop loader (Rust)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the stable branch, 2026-10-16
        with:
          toolchain: stable
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/softn-loader/src-tauri/target/
            apps/softn-builder/src-tauri/target/
          key: loader-check-${{ hashFiles('apps/softn-loader/src-tauri/Cargo.lock', 'apps/softn-builder/src-tauri/Cargo.lock') }}
          restore-keys: loader-check-
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Test the loader
        run: cargo test --manifest-path apps/softn-loader/src-tauri/Cargo.toml --locked
      # The Builder's window draws an untrusted bundle's preview, and its file
      # commands are driven here as any script in that page could
      # (tests/project_files.rs). They ran in no workflow.
      - name: Test the Builder's file commands
        run: cargo test --manifest-path apps/softn-builder/src-tauri/Cargo.toml --locked

  # What only Windows builds: the runner without Node as a Windows FormLogic
  # starts it (release.yml ships softn-runner-windows-x86_64.exe, which no
  # job ran), and the loader's shell extension, whose thumbnails read crafted
  # bundles (UNC images, decompression bombs, the SVG stack) and which depends
  # on the `windows` crate.
  windows:
    name: Windows runner and shell extension (Rust)
    runs-on: windows-latest
    env:
      ZIPP_RELEASE: ${{ inputs.zipp-release }}
      ZIPP_SUMS_SHA256: ${{ inputs.zipp-sums-sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install the ZIPP release
        run: node packages/@softn/core/scripts/fetch-zipp-release.mjs --ensure
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/softn-runner/guest/target/
            apps/softn-runner/host/target/
            apps/softn-loader/shell-extension/target/
          key: windows-${{ hashFiles('apps/softn-runner/guest/Cargo.lock', 'apps/softn-runner/host/Cargo.lock', 'apps/softn-loader/shell-extension/Cargo.lock') }}
          restore-keys: windows-
      - name: Build the runner
        run: node apps/softn-runner/build.mjs
      - name: Test the runner's own parts
        working-directory: apps/softn-runner/host
        run: cargo test --release --locked
      - name: The Node runner's suite, on the runner
        env:
          SOFTN_TEST_RUNNER: ${{ github.workspace }}\apps\softn-runner\dist\softn-runner-windows-x86_64.exe
        run: node --test apps/softn-host-php/tests/route-declarations.test.mjs
      - name: Test the shell extension
        run: cargo test --manifest-path apps/softn-loader/shell-extension/Cargo.toml --locked
