<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Visual editor for SoftN applications" />
    <!-- The colour the browser paints around the app, which has to be the colour
         the app actually is; the pre-paint script below corrects it for the
         light theme. -->
    <meta name="theme-color" content="#101317" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- The apple- prefixed form is the deprecated spelling, kept because iOS Safari still
         only honours that one for standalone display. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <!--
      Runs before the first paint so a reader never sees the wrong ground flash
      first. The same script, with the same key, is in every SoftN app's
      index.html; @softn/brand's theme.ts is the copy to check against.
    -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('softn.site.theme');
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            theme = 'light';
          }
        } catch (e) {
          /* Storage blocked; the dark default stands. */
        }
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#f4f6f9' : '#101317');
      })();
    </script>
    <title>SoftN Builder</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body, #root {
        height: 100%;
        overflow: hidden;
      }
      :root {
        --b-display: 'Bricolage Grotesque Variable', 'Bricolage Grotesque', system-ui, sans-serif;
        --b-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --b-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      body {
        font-family: var(--b-body);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: var(--ink, #101317);
        color: var(--paper, #f2f0ec);
      }
      /* Until the tokens arrive with the bundle, the pre-paint choice paints the ground. */
      html[data-theme='light'] body {
        background: var(--ink, #f4f6f9);
        color: var(--paper, #14181d);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
