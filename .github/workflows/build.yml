name: Build SoftN

# The checks run on every push to main and every pull request against it: the
# engine this used to have to compile from a separate repository now lives at
# packages/@softn/core/wasm-zipp/, committed, so there is nothing to fetch and
# no reason for a merge to skip typecheck, lint and the test suites. The steps
# themselves are in verify.yml, shared with the release workflow. The
# desktop builds are the exception — six platform runners per push is a cost
# a typo does not justify — and stay behind the manual trigger, which still
# runs everything.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # The verification steps live in verify.yml, which the release workflow
  # calls as well, so a tag is held to exactly what a push is.
  check:
    name: Verify
    uses: ./.github/workflows/verify.yml

  build-web:
    name: Build Web Runtime
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: |
          npm run build:packages
          npm run build -w @softn/web

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: softn-web
          path: apps/softn-web/dist/
          retention-days: 7

  build-tauri:
    name: Build ${{ matrix.app }} (${{ matrix.platform }})
    needs: check
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: softn-loader
            platform: ubuntu-22.04
          - app: softn-loader
            platform: windows-latest
          - app: softn-loader
            platform: macos-latest
          - app: softn-builder
            platform: ubuntu-22.04
          - app: softn-builder
            platform: windows-latest
          - app: softn-builder
            platform: macos-latest
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned xdb.org dependency
        if: matrix.app == 'softn-loader'
        run: bash .github/scripts/checkout-xdb.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/${{ matrix.app }}/src-tauri/target/
          key: tauri-${{ matrix.app }}-${{ matrix.platform }}-${{ hashFiles('apps/**/Cargo.lock') }}
          restore-keys: tauri-${{ matrix.app }}-${{ matrix.platform }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:packages

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/${{ matrix.app }}
          # Skip Tauri's built-in DMG bundling on macOS — bundle_dmg.sh fails
          # on headless CI runners. We create the DMG manually in the next step.
          args: ${{ startsWith(matrix.platform, 'macos') && '--bundles app' || '' }}

      - name: Create DMG (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          APP_DIR="apps/${{ matrix.app }}/src-tauri/target/release/bundle/macos"
          DMG_DIR="apps/${{ matrix.app }}/src-tauri/target/release/bundle/dmg"
          mkdir -p "$DMG_DIR"
          APP_PATH=$(find "$APP_DIR" -maxdepth 1 -name "*.app" | head -1)
          APP_NAME=$(basename "$APP_PATH" .app)
          hdiutil create -volname "$APP_NAME" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_DIR/$APP_NAME.dmg"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ matrix.platform }}
          path: |
            apps/${{ matrix.app }}/src-tauri/target/release/bundle/**/*.exe
            apps/${{ matrix.app }}/src-tauri/target/release/bundle/**/*.msi
            apps/${{ matrix.app }}/src-tauri/target/release/bundle/**/*.dmg
            apps/${{ matrix.app }}/src-tauri/target/release/bundle/**/*.AppImage
            apps/${{ matrix.app }}/src-tauri/target/release/bundle/**/*.deb
          retention-days: 7
