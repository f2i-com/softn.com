name: Build SoftN

# The full build, dispatched by hand: the shared verification (verify.yml),
# then the web runtime and every hosting archive (tested under Apache/PHP), and
# the desktop loader and Builder on Linux, Windows and macOS. Pushes to main and
# pull requests are verified by ci.yml, which calls the same verify.yml; this
# adds the packaging and the six-runner desktop matrix, which are too slow to
# run on every push.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The verification steps live in verify.yml, which the release workflow
  # calls as well, so a tag is held to exactly what a push is.
  check:
    name: Verify
    uses: ./.github/workflows/verify.yml

  build-web:
    name: Build Web Runtime
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # packages/@softn/core/wasm-zipp/ is generated: the ZIPP release the
      # apps/softn-host-rust/Cargo.toml zipp-vm tag names.
      - name: Install the ZIPP release
        run: node packages/@softn/core/scripts/fetch-zipp-release.mjs --ensure

      - name: Build packages
        run: |
          npm run build:packages
          npm run build -w @softn/web
          npm run build -w @softn/single
          npm run package:single -- --with-backend
          npm run build -w @softn/single-private
          npm run package:single-private
          npm run package:private-single-php
          npm run package:formlogic-runtime -- --tag "v$(node -p "require('./package.json').version")" --no-build-packages

      - name: Install Apache/PHP test dependencies
        run: sudo apt-get update && sudo apt-get install -y apache2 php-cli php-cgi php-gd

      - name: Verify the optional backend distribution
        run: |
          python3 scripts/test-single-backend.py --archive "$(ls release/softn-app-static-with-backend-linux-x64-v*.zip)"
          python3 apps/softn-host-php/tests/apache-smoke.py --archive "$(ls release/softn-app-static-with-backend-linux-x64-v*.zip)"
          python3 scripts/test-single-backend.py --private --archive "$(ls release/softn-app-private-with-backend-linux-x64-v*.zip)"
          python3 apps/softn-host-php/tests/apache-smoke.py --private --archive "$(ls release/softn-app-private-with-backend-linux-x64-v*.zip)"

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: softn-web
          path: apps/softn-web/dist/
          retention-days: 7

      - name: Upload single-app hosting ZIP
        uses: actions/upload-artifact@v4
        with:
          name: softn-single-hosting
          path: |
            release/softn-app-static-v*.zip
            release/softn-app-static-v*.zip.sha256
            release/softn-app-static-with-backend-linux-x64-v*.zip
            release/softn-app-static-with-backend-linux-x64-v*.zip.sha256
            release/softn-app-private-v*.zip
            release/softn-app-private-v*.zip.sha256
            release/softn-app-private-with-backend-linux-x64-v*.zip
            release/softn-app-private-with-backend-linux-x64-v*.zip.sha256
            release/softn-formlogic-runtime-v*.zip
            release/softn-formlogic-runtime-v*.zip.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  build-tauri:
    name: Build ${{ matrix.app }} (${{ matrix.platform }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: softn-loader
            platform: ubuntu-22.04
          - app: softn-loader
            platform: windows-latest
          - app: softn-loader
            platform: macos-latest
          - app: softn-builder
            platform: ubuntu-22.04
          - app: softn-builder
            platform: windows-latest
          - app: softn-builder
            platform: macos-latest
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned xdb.org dependency
        if: matrix.app == 'softn-loader'
        run: bash .github/scripts/checkout-xdb.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/${{ matrix.app }}/src-tauri/target/
          key: tauri-${{ matrix.app }}-${{ matrix.platform }}-${{ hashFiles('apps/**/Cargo.lock') }}
          restore-keys: tauri-${{ matrix.app }}-${{ matrix.platform }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Install the ZIPP release
        run: node packages/@softn/core/scripts/fetch-zipp-release.mjs --ensure

      - name: Build shared packages
        run: npm run build:packages

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/${{ matrix.app }}
          # Skip Tauri's built-in DMG bundling on macOS — bundle_dmg.sh fails
          # on headless CI runners. We create the DMG manually in the next step.
          args: ${{ startsWith(matrix.platform, 'macos') && '--bundles app' || '' }}

      - name: Create DMG (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          APP_DIR="apps/${{ matrix.app }}/src-tauri/target/release/bundle/macos"
          DMG_DIR="apps/${{ matrix.app }}/src-tauri/target/release/bundle/dmg"
          mkdir -p "$DMG_DIR"
          APP_PATH=$(find "$APP_DIR" -maxdepth 1 -name "*.app" | head -1)
          APP_NAME=$(basename "$APP_PATH" .app)
          hdiutil create -volname "$APP_NAME" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_DIR/$APP_NAME.dmg"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ matrix.platform }}
          path: |
            apps/${{ matrix.app }}/src-tauri/target/release/bundle/**/*.exe
            apps/${{ matrix.app }}/src-tauri/target/release/bundle/**/*.msi
            apps/${{ matrix.app }}/src-tauri/target/release/bundle/**/*.dmg
            apps/${{ matrix.app }}/src-tauri/target/release/bundle/**/*.AppImage
            apps/${{ matrix.app }}/src-tauri/target/release/bundle/**/*.deb
          retention-days: 7
