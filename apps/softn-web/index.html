<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101317" />
    <meta name="description" content="SoftN Web — Run .softn application bundles in the browser" />
    <!--
      Runs before the first paint so a light-mode reader never sees the dark
      ground flash first. It duplicates the key and the resolution rule from
      @softn/brand's theme.ts on purpose: the module cannot help here, because
      by the time the bundle has loaded the wrong colours are already on screen.
      The same script is in the site's, Studio's and Builder's index.html.
    -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('softn.site.theme');
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            theme = 'light';
          }
        } catch (e) {
          /* Storage blocked; the dark default stands. */
        }
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#f4f6f9' : '#101317');
      })();
    </script>
    <title>SoftN Runtime</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        height: 100%;
        overflow: hidden;
        font-family: var(--body, 'IBM Plex Sans', system-ui, -apple-system, sans-serif);
        background: var(--ink, #101317);
        color: var(--paper, #f2f0ec);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
