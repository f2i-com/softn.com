name: Build SoftN

# The full build, dispatched by hand: the shared verification (verify.yml),
# the web runtime and the hosting archives a release builds from it (tested
# under Apache/PHP; the website archive and the FormLogic runtime's runner are
# a release's alone, release.yml), and the
# desktop loader and Builder on Linux, Windows and macOS. Pushes to main and
# pull requests are verified by ci.yml, which calls the same verify.yml; this
# adds the packaging and the six-runner desktop matrix, which are too slow to
# run on every push. The builds start beside the verification rather than
# after it: nothing here is published (the artifacts are kept with the run for
# a week), and the run fails whichever of them fails, so waiting only made a
# good commit's build take longer.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Read the repository and nothing else, whatever the repository's default is:
# this workflow publishes nothing (tauri-action is given no tag to release to).
permissions:
  contents: read

jobs:
  # The verification steps live in verify.yml, which the release workflow
  # calls as well, so a tag is held to exactly what a push is.
  check:
    name: Verify
    uses: ./.github/workflows/verify.yml

  build-web:
    name: Build Web Runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # packages/@softn/core/wasm-zipp/ is generated: the ZIPP release the
      # apps/softn-host-rust/Cargo.toml zipp-vm tag names.
      - name: Install the ZIPP release
        run: node packages/@softn/core/scripts/fetch-zipp-release.mjs --ensure

      # softn-runner, built as release.yml's runner job builds it (static
      # Linux), so that the two backend archives below carry it as a
      # release's do and the Apache tests run their requests on it, locked
      # down, before a release rather than during one.
      - name: The runner's static Linux target
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          cd apps/softn-runner/host && rustup target add x86_64-unknown-linux-musl
      - name: Cache Cargo for the runner
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/softn-runner/guest/target/
            apps/softn-runner/host/target/
          key: runner-${{ runner.os }}-${{ hashFiles('apps/softn-runner/guest/Cargo.lock', 'apps/softn-runner/host/Cargo.lock') }}
          restore-keys: runner-${{ runner.os }}-
      - name: Build the runner
        run: node apps/softn-runner/build.mjs --target x86_64-unknown-linux-musl

      - name: Build packages
        run: |
          npm run build:packages
          npm run build -w @softn/web
          npm run build -w @softn/single
          npm run package:single -- --with-backend --runner-dir apps/softn-runner/dist
          npm run build -w @softn/single-private
          npm run package:single-private
          npm run package:private-single-php -- --runner-dir apps/softn-runner/dist
          for zip in release/softn-app-static-with-backend-linux-x64-v*.zip release/softn-app-private-with-backend-linux-x64-v*.zip; do
            unzip -Z1 "$zip" | grep -qx 'backend/bin/softn-runner-linux-x86_64'
          done
          npm run package:formlogic-runtime -- --tag "v$(node -p "require('./package.json').version")" --no-build-packages

      - name: Install Apache/PHP test dependencies
        run: sudo apt-get update && sudo apt-get install -y apache2 php-cli php-cgi php-gd php-zip

      - name: Verify the optional backend distribution
        run: |
          python3 scripts/release/test-single-backend.py --archive "$(ls release/softn-app-static-with-backend-linux-x64-v*.zip)"
          python3 apps/softn-host-php/tests/apache-smoke.py --archive "$(ls release/softn-app-static-with-backend-linux-x64-v*.zip)"
          python3 scripts/release/test-single-backend.py --private --archive "$(ls release/softn-app-private-with-backend-linux-x64-v*.zip)"
          python3 apps/softn-host-php/tests/apache-smoke.py --private --archive "$(ls release/softn-app-private-with-backend-linux-x64-v*.zip)"

      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: softn-web
          path: apps/softn-web/dist/
          retention-days: 7

      - name: Upload single-app hosting ZIP
        uses: actions/upload-artifact@v7
        with:
          name: softn-single-hosting
          path: |
            release/softn-app-static-v*.zip
            release/softn-app-static-v*.zip.sha256
            release/softn-app-static-with-backend-linux-x64-v*.zip
            release/softn-app-static-with-backend-linux-x64-v*.zip.sha256
            release/softn-app-private-v*.zip
            release/softn-app-private-v*.zip.sha256
            release/softn-app-private-with-backend-linux-x64-v*.zip
            release/softn-app-private-with-backend-linux-x64-v*.zip.sha256
            release/softn-formlogic-runtime-v*.zip
            release/softn-formlogic-runtime-v*.zip.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  build-tauri:
    name: Build ${{ matrix.app }} (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: softn-loader
            platform: ubuntu-22.04
          - app: softn-loader
            platform: windows-latest
          - app: softn-loader
            platform: macos-latest
          - app: softn-builder
            platform: ubuntu-22.04
          - app: softn-builder
            platform: windows-latest
          - app: softn-builder
            platform: macos-latest
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the stable branch, 2026-10-16
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/${{ matrix.app }}/src-tauri/target/
          key: tauri-${{ matrix.app }}-${{ matrix.platform }}-${{ hashFiles('apps/**/Cargo.lock') }}
          restore-keys: tauri-${{ matrix.app }}-${{ matrix.platform }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Install the ZIPP release
        run: node packages/@softn/core/scripts/fetch-zipp-release.mjs --ensure

      - name: Build shared packages
        run: npm run build:packages

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1, 2026-06-29
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/${{ matrix.app }}
          # Skip Tauri's built-in DMG bundling on macOS — bundle_dmg.sh fails
          # on headless CI runners. We create the DMG manually in the next step.
          args: ${{ startsWith(matrix.platform, 'macos') && '--bundles app' || '' }}

      - name: Create DMG (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          APP_DIR="apps/${{ matrix.app }}/src-tauri/target/release/bundle/macos"
          DMG_DIR="apps/${{ matrix.app }}/src-tauri/target/release/bundle/dmg"
          mkdir -p "$DMG_DIR"
          APP_PATH=$(find "$APP_DIR" -maxdepth 1 -name "*.app" | head -1)
          APP_NAME=$(basename "$APP_PATH" .app)
          hdiutil create -volname "$APP_NAME" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_DIR/$APP_NAME.dmg"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app }}-${{ matrix.platform }}
          path: |
            apps/${{ matrix.app }}/src-tauri/target/release/bundle/**/*.exe
            apps/${{ matrix.app }}/src-tauri/target/release/bundle/**/*.msi
            apps/${{ matrix.app }}/src-tauri/target/release/bundle/**/*.dmg
            apps/${{ matrix.app }}/src-tauri/target/release/bundle/**/*.AppImage
            apps/${{ matrix.app }}/src-tauri/target/release/bundle/**/*.deb
          retention-days: 7
