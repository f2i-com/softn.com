name: Release

# A release is built from an existing version tag. The zipp WASM engine used
# by `.logic` is vendored in packages/@softn/core/wasm-zipp/, so releases build
# the shared packages directly from the checked-in engine.
#
# Two kinds of artifact go on the release: the desktop apps, one job per app
# and platform, and the website — the complete static softn.com as one archive
# whose contents drop into a web host's document root (`website` below).
#
# Pushing the tag is the trigger. The dispatch entry stays for retrying an
# infrastructure failure without moving a tag that has already been published,
# and deliberately cannot release an arbitrary branch: both paths check out
# refs/tags/<tag> and refuse if HEAD is not that tag's commit.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example, v1.1.0)
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Release ${{ matrix.app }} (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: softn-loader
            platform: ubuntu-22.04
          - app: softn-loader
            platform: windows-latest
          - app: softn-loader
            platform: macos-latest
          - app: softn-builder
            platform: ubuntu-22.04
          - app: softn-builder
            platform: windows-latest
          - app: softn-builder
            platform: macos-latest
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.2.3 or v1.2.3-beta.1" >&2
            exit 1
          fi

      # Build the commit named by the tag, never whichever branch happened to
      # dispatch the workflow. Requiring an existing tag also prevents a typo
      # from publishing unrelated artifacts under a new release name.
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify checked-out release provenance
        run: |
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" ]]; then
            echo "Checked-out commit does not match $RELEASE_TAG" >&2
            exit 1
          fi

      # tauri-action takes the version it stamps on every artifact from
      # tauri.conf.json, NOT from the tag. A tag that disagrees with the
      # manifests therefore does not fail — it quietly publishes artifacts named
      # after the manifest. v1.1.0 shipped that way: every asset was called
      # SoftN-0.1.0-* and collided with the identically named ones already
      # attached to v1.0.0. Nothing reported a problem, because from the
      # workflow's point of view nothing had gone wrong.
      - name: Verify the tag matches every manifest
        run: |
          set -euo pipefail
          expected="${RELEASE_TAG#v}"
          fail=0
          check() {
            local name="$1" actual="$2"
            if [[ "$actual" != "$expected" ]]; then
              echo "$name is $actual, but the tag says $expected" >&2
              fail=1
            fi
          }
          check "package.json" "$(node -p "require('./package.json').version")"
          for app in softn-loader softn-builder; do
            check "apps/$app/src-tauri/tauri.conf.json" \
              "$(node -p "require('./apps/$app/src-tauri/tauri.conf.json').version")"
            check "apps/$app/package.json" \
              "$(node -p "require('./apps/$app/package.json').version")"
          done
          if [[ "$fail" -ne 0 ]]; then
            echo "Refusing to publish: the tag and the manifests disagree." >&2
            exit 1
          fi
          echo "tag $RELEASE_TAG matches every manifest"

      - name: Checkout pinned xdb.org dependency
        if: matrix.app == 'softn-loader'
        run: bash .github/scripts/checkout-xdb.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/${{ matrix.app }}/src-tauri/target/
          key: tauri-${{ matrix.app }}-${{ matrix.platform }}-${{ hashFiles('apps/**/Cargo.lock') }}
          restore-keys: tauri-${{ matrix.app }}-${{ matrix.platform }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency lockfile
        run: npm audit --audit-level=high

      - name: Build shared packages
        run: npm run build:packages

      - name: Build Tauri app and attach to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/${{ matrix.app }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'SoftN ${{ env.RELEASE_TAG }}'
          releaseBody: |
            ## SoftN ${{ env.RELEASE_TAG }}

            ### Downloads

            | App | Description |
            |-----|-------------|
            | **SoftN Loader** | Desktop runtime for running `.softn` bundles |
            | **SoftN Builder** | Visual IDE for creating SoftN applications |
            | **Website** | The complete static softn.com (`softn-com-*.zip`): upload its contents to a web host's document root; `DEPLOY.md` inside explains the rest |

            **Platforms:** Windows (.exe, .msi), macOS (.dmg), Linux (.AppImage, .deb)
          releaseDraft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          # Skip Tauri's built-in DMG bundling on macOS — bundle_dmg.sh fails
          # on headless CI runners. We create and upload the DMG manually below.
          args: ${{ startsWith(matrix.platform, 'macos') && '--bundles app' || '' }}

      - name: Create and upload DMG (macOS)
        if: startsWith(matrix.platform, 'macos')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_DIR="apps/${{ matrix.app }}/src-tauri/target/release/bundle/macos"
          DMG_DIR="apps/${{ matrix.app }}/src-tauri/target/release/bundle/dmg"
          mkdir -p "$DMG_DIR"
          APP_PATH=$(find "$APP_DIR" -maxdepth 1 -name "*.app" | head -1)
          APP_NAME=$(basename "$APP_PATH" .app)
          DMG_PATH="$DMG_DIR/$APP_NAME.dmg"
          hdiutil create -volname "$APP_NAME" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_PATH"
          gh release upload "$RELEASE_TAG" "$DMG_PATH" --clobber

  # The website: everything softn.com serves — the landing page, the web
  # runtime, the builder, the studio, the demo bundles, the precompressed twins,
  # `.htaccess` and DEPLOY.md — built from the tagged commit and packaged as
  # one archive by scripts/package-site.mjs, which reads the archive back and
  # compares every entry with dist/ before the file is allowed to exist.
  #
  # Independent of the desktop matrix on purpose: a failed macOS build must not
  # hold back the website, and the website takes minutes where the apps take
  # tens. The release itself is created by whichever job gets there first;
  # tauri-action attaches to an existing release, and this job creates one if
  # none exists yet.
  website:
    name: Package the website
    permissions:
      contents: write
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.2.3 or v1.2.3-beta.1" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify checked-out release provenance
        run: |
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" ]]; then
            echo "Checked-out commit does not match $RELEASE_TAG" >&2
            exit 1
          fi

      # BUILD-INFO.json inside the archive records the commit; the archive's
      # name records the tag. The two must agree with package.json, or the
      # site would announce one version and be another.
      - name: Verify the tag matches package.json
        run: |
          expected="${RELEASE_TAG#v}"
          actual="$(node -p "require('./package.json').version")"
          if [[ "$actual" != "$expected" ]]; then
            echo "package.json is $actual, but the tag says $expected" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency lockfile
        run: npm audit --audit-level=high

      # The vendored engine's SOURCE.json must name the artifact that is really
      # there, and every shipped dependency must have its licence text: both
      # end up inside the archive.
      - name: Check engine provenance and licence notices
        run: npm run licenses:check

      # The build stamps BUILD-INFO.json with SOURCE_DATE_EPOCH when set, so
      # `builtAt` is the tagged commit's own time rather than the runner's
      # clock, and two runs of one tag produce the same record.
      - name: Build the website
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct HEAD)"
          npm run build:site
          test -f dist/index.html && test -f dist/.htaccess && test -f dist/BUILD-INFO.json
          if [[ "$(node -p "require('./dist/BUILD-INFO.json').softn.dirty")" != "false" ]]; then
            echo "BUILD-INFO.json reports a dirty tree; the build did not come from the tag alone" >&2
            exit 1
          fi

      - name: Package and verify the archive
        run: node scripts/package-site.mjs --tag "$RELEASE_TAG" --out release

      # A second opinion from a tool that shares no code with the packager.
      - name: Test the archive with unzip
        run: |
          set -euo pipefail
          zip="$(ls release/*.zip)"
          unzip -tq "$zip"
          listed="$(unzip -Z1 "$zip" | wc -l)"
          onDisk="$(find dist -type f | wc -l)"
          if [[ "$listed" != "$onDisk" ]]; then
            echo "archive lists $listed entries, dist/ has $onDisk files" >&2
            exit 1
          fi
          unzip -Z1 "$zip" | grep -qx '.htaccess'
          (cd release && sha256sum -c ./*.sha256 --strict)
          echo "$zip: $listed entries, $(du -h "$zip" | cut -f1)"

      - name: Keep the archive with the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: website-${{ env.RELEASE_TAG }}
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error

      - name: Attach the archive to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Whichever job reaches the release first creates it. If a desktop
          # job creates it between the check and the create below, the create
          # fails harmlessly and the upload goes to the release that exists.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            prerelease=""
            if [[ "$RELEASE_TAG" == *-* ]]; then prerelease="--prerelease"; fi
            notes="$(cat .github/release-notes.md)"
            notes="${notes//RELEASE_TAG/$RELEASE_TAG}"
            gh release create "$RELEASE_TAG" --title "SoftN $RELEASE_TAG" $prerelease --notes "$notes" \
              || echo "release already exists; attaching to it"
          fi
          gh release upload "$RELEASE_TAG" release/*.zip release/*.sha256 --clobber
          echo "attached: $(ls release | tr '\n' ' ')"
