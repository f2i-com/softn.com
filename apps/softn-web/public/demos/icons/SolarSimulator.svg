<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="58%" stop-color="#090d1e"/>
      <stop offset="100%" stop-color="#03050c"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="36%" stop-color="#fbbf24"/>
      <stop offset="72%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="26" fill="url(#bg)"/>
  <circle cx="24" cy="26" r="1.3" fill="#e0f2fe" opacity="0.85"/>
  <circle cx="102" cy="22" r="1.5" fill="#fef08a" opacity="0.9"/>
  <circle cx="108" cy="96" r="1.2" fill="#bae6fd" opacity="0.75"/>
  <circle cx="20" cy="98" r="1.4" fill="#fed7aa" opacity="0.8"/>

  <!-- Orbital ellipses -->
  <ellipse cx="62" cy="66" rx="34" ry="18" transform="rotate(-18 62 66)" stroke="#38bdf8" stroke-opacity="0.42" stroke-width="1.6"/>
  <ellipse cx="62" cy="66" rx="50" ry="27" transform="rotate(-18 62 66)" stroke="#f59e0b" stroke-opacity="0.38" stroke-width="1.6"/>

  <!-- Sun & Binary companion -->
  <circle cx="58" cy="65" r="24" fill="url(#sunGlow)"/>
  <circle cx="58" cy="65" r="13.5" fill="#fde047"/>
  <circle cx="76" cy="57" r="5.2" fill="#fb7185"/>

  <!-- Earth -->
  <circle cx="31" cy="74" r="5.6" fill="#2563eb"/>
  <path d="M28.5 72.2C30.2 71.4 32.1 72.1 32.9 73.6C31.8 75.2 29.8 75.5 28.5 74.1Z" fill="#22c55e"/>

  <!-- Ringed Saturn -->
  <ellipse cx="97" cy="44" rx="13" ry="4.4" transform="rotate(-24 97 44)" stroke="url(#ringGrad)" stroke-width="2.4"/>
  <circle cx="97" cy="44" r="6.2" fill="#f59e0b"/>

  <!-- Incoming glowing asteroid -->
  <path d="M18 36 L34 49" stroke="#fb923c" stroke-width="2.6" stroke-linecap="round" opacity="0.85"/>
  <circle cx="35.5" cy="50.2" r="3.1" fill="#fed7aa"/>
</svg>
