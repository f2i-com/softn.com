<!DOCTYPE html>
<html lang="en">
<head>
  <script src="softn/softn.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-do list</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <nav class="side">
      <p class="brand">HTML in SoftN</p>
      <NavItem icon="home" label="Back to the start" navigate="index.html" />
      <NavItem icon="list" label="To-do list" navigate="tasks.html" active />
      <NavItem icon="file" label="About" navigate="about.html" />
    </nav>

    <main>
      <h1 id="title">Tasks</h1>
      <p class="hint">Plain HTML and browser JavaScript: no SoftN syntax on this page but the menu.</p>
      <form id="add">
        <input id="task" name="task" placeholder="New task" autocomplete="off">
        <select id="who"><option value="me">Me</option><option value="you">You</option></select>
        <label><input id="urgent" type="checkbox"> urgent</label>
        <button type="submit">Add</button>
      </form>
      <ul id="list" class="tasks"></ul>
      <p><span id="count">0 tasks left</span> <button id="clear" type="button">Clear done</button></p>
      <p id="status" class="hint"></p>
    </main>
  </div>

  <script>
    const list = document.getElementById('list');
    const count = document.getElementById('count');

    function render() {
      const left = list.querySelectorAll('li:not(.done)').length;
      count.textContent = left + (left === 1 ? ' task' : ' tasks') + ' left';
    }

    document.getElementById('add').addEventListener('submit', function (e) {
      e.preventDefault();
      const input = document.getElementById('task');
      const text = input.value.trim();
      if (!text) return;
      const li = document.createElement('li');
      li.innerHTML = '<span class="text"></span> <small class="who"></small> <button class="del" type="button" title="Remove">&times;</button>';
      li.querySelector('.text').textContent = text;
      li.querySelector('.who').textContent = document.getElementById('who').value;
      if (document.getElementById('urgent').checked) li.classList.add('urgent');
      list.appendChild(li);
      input.value = '';
      input.focus();
      render();
      setTimeout(function () { document.getElementById('status').textContent = 'Added "' + text + '"'; }, 300);
    });

    list.addEventListener('click', function (e) {
      const li = e.target.closest('li');
      if (!li) return;
      if (e.target.classList.contains('del')) li.remove();
      else li.classList.toggle('done');
      render();
    });

    document.getElementById('clear').addEventListener('click', function () {
      list.querySelectorAll('li.done').forEach(function (li) { li.remove(); });
      render();
    });

    document.addEventListener('DOMContentLoaded', function () {
      document.getElementById('title').textContent = 'My tasks';
      render();
    });
  </script>
</body>
</html>
