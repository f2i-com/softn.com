<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="foxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.3" />

  <!-- Ecosystem Circular Cycle Ring -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="8 6" stroke-opacity="0.4" />

  <!-- Grass Blades at Bottom -->
  <path d="M 28 108 Q 30 84 36 76 Q 40 88 44 108 Z" fill="#22c55e" />
  <path d="M 40 108 Q 44 78 52 70 Q 56 86 60 108 Z" fill="#4ade80" />
  <path d="M 58 108 Q 64 74 72 68 Q 74 86 78 108 Z" fill="#22c55e" />
  <path d="M 76 108 Q 80 80 88 74 Q 92 88 96 108 Z" fill="#4ade80" />

  <!-- Stylized Fox (Predator) Left-Upper -->
  <g filter="url(#drop)">
    <!-- Fox Face / Ears -->
    <path d="M 38 48 L 46 22 L 56 38 Z" fill="#c2410c" />
    <path d="M 68 38 L 78 22 L 86 48 Z" fill="#c2410c" />
    <path d="M 42 46 L 47 28 L 54 40 Z" fill="#f97316" />
    <path d="M 70 40 L 77 28 L 82 46 Z" fill="#f97316" />
    <!-- Fox Head Muzzle -->
    <path d="M 36 46 Q 62 38 88 46 Q 92 68 62 84 Q 32 68 36 46 Z" fill="url(#foxGrad)" />
    <!-- White Fur Cheeks -->
    <path d="M 38 52 Q 48 64 62 84 Q 44 72 38 52 Z" fill="#f8fafc" />
    <path d="M 86 52 Q 76 64 62 84 Q 80 72 86 52 Z" fill="#f8fafc" />
    <!-- Fox Eyes -->
    <polygon points="46,52 54,55 48,58" fill="#1e293b" />
    <polygon points="78,52 70,55 76,58" fill="#1e293b" />
    <!-- Fox Nose -->
    <circle cx="62" cy="81" r="3.5" fill="#0f172a" />
  </g>

  <!-- Cute Rabbit (Prey) Silhouette Lower Right -->
  <g filter="url(#drop)" transform="translate(68, 64) scale(0.65)">
    <!-- Bunny Ears -->
    <ellipse cx="28" cy="12" rx="5" ry="16" fill="#f8fafc" transform="rotate(-10 28 12)" />
    <ellipse cx="28" cy="12" rx="2.8" ry="11" fill="#f472b6" transform="rotate(-10 28 12)" />
    <ellipse cx="40" cy="14" rx="5" ry="16" fill="#f8fafc" transform="rotate(12 40 14)" />
    <ellipse cx="40" cy="14" rx="2.8" ry="11" fill="#f472b6" transform="rotate(12 40 14)" />
    <!-- Bunny Head -->
    <circle cx="34" cy="30" r="14" fill="#f8fafc" />
    <circle cx="29" cy="28" r="2.2" fill="#0f172a" />
    <circle cx="39" cy="28" r="2.2" fill="#0f172a" />
    <ellipse cx="34" cy="34" rx="1.8" ry="1.2" fill="#f43f5e" />
    <!-- Bunny Body & Tail -->
    <ellipse cx="34" cy="46" rx="16" ry="14" fill="#f8fafc" />
    <circle cx="48" cy="50" r="5" fill="#ffffff" />
  </g>
</svg>
