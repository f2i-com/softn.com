name: Release

# A release is built from an existing version tag. The zipp WASM engine used
# by `.logic` is vendored in packages/@softn/core/wasm-zipp/, so releases build
# the shared packages directly from the checked-in engine.
#
# Pushing the tag is the trigger. The dispatch entry stays for retrying an
# infrastructure failure without moving a tag that has already been published,
# and deliberately cannot release an arbitrary branch: both paths check out
# refs/tags/<tag> and refuse if HEAD is not that tag's commit.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example, v1.1.0)
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Release ${{ matrix.app }} (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: softn-loader
            platform: ubuntu-22.04
          - app: softn-loader
            platform: windows-latest
          - app: softn-loader
            platform: macos-latest
          - app: softn-builder
            platform: ubuntu-22.04
          - app: softn-builder
            platform: windows-latest
          - app: softn-builder
            platform: macos-latest
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.2.3 or v1.2.3-beta.1" >&2
            exit 1
          fi

      # Build the commit named by the tag, never whichever branch happened to
      # dispatch the workflow. Requiring an existing tag also prevents a typo
      # from publishing unrelated artifacts under a new release name.
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify checked-out release provenance
        run: |
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" ]]; then
            echo "Checked-out commit does not match $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Checkout pinned xdb.org dependency
        if: matrix.app == 'softn-loader'
        run: bash .github/scripts/checkout-xdb.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/${{ matrix.app }}/src-tauri/target/
          key: tauri-${{ matrix.app }}-${{ matrix.platform }}-${{ hashFiles('apps/**/Cargo.lock') }}
          restore-keys: tauri-${{ matrix.app }}-${{ matrix.platform }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency lockfile
        run: npm audit --audit-level=high

      - name: Build shared packages
        run: npm run build:packages

      - name: Build Tauri app and attach to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/${{ matrix.app }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'SoftN ${{ env.RELEASE_TAG }}'
          releaseBody: |
            ## SoftN ${{ env.RELEASE_TAG }}

            ### Downloads

            | App | Description |
            |-----|-------------|
            | **SoftN Loader** | Desktop runtime for running `.softn` bundles |
            | **SoftN Builder** | Visual IDE for creating SoftN applications |

            **Platforms:** Windows (.exe, .msi), macOS (.dmg), Linux (.AppImage, .deb)
          releaseDraft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          # Skip Tauri's built-in DMG bundling on macOS — bundle_dmg.sh fails
          # on headless CI runners. We create and upload the DMG manually below.
          args: ${{ startsWith(matrix.platform, 'macos') && '--bundles app' || '' }}

      - name: Create and upload DMG (macOS)
        if: startsWith(matrix.platform, 'macos')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_DIR="apps/${{ matrix.app }}/src-tauri/target/release/bundle/macos"
          DMG_DIR="apps/${{ matrix.app }}/src-tauri/target/release/bundle/dmg"
          mkdir -p "$DMG_DIR"
          APP_PATH=$(find "$APP_DIR" -maxdepth 1 -name "*.app" | head -1)
          APP_NAME=$(basename "$APP_PATH" .app)
          DMG_PATH="$DMG_DIR/$APP_NAME.dmg"
          hdiutil create -volname "$APP_NAME" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_PATH"
          gh release upload "$RELEASE_TAG" "$DMG_PATH" --clobber
