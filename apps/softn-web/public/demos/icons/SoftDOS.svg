<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8e4d8"/>
      <stop offset="100%" stop-color="#bfbba8"/>
    </linearGradient>
    <radialGradient id="screenGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#142814"/>
      <stop offset="100%" stop-color="#050e05"/>
    </radialGradient>
  </defs>
  <!-- Outer Bezel -->
  <rect x="8" y="10" width="112" height="96" rx="8" fill="url(#bezelGrad)" stroke="#8e8a78" stroke-width="2"/>
  <!-- CRT Screen Recess -->
  <rect x="18" y="18" width="92" height="74" rx="6" fill="#000" stroke="#686458" stroke-width="2"/>
  <!-- CRT Screen Tube -->
  <rect x="20" y="20" width="88" height="70" rx="4" fill="url(#screenGrad)"/>
  <!-- Glowing Text / Prompt -->
  <text x="26" y="38" fill="#33ff33" font-family="monospace" font-size="11" font-weight="bold">C:\&gt; DOOM</text>
  <rect x="84" y="28" width="7" height="11" fill="#33ff33" opacity="0.8"/>
  <text x="26" y="58" fill="#22aa22" font-family="monospace" font-size="9">32-bit x86</text>
  <text x="26" y="74" fill="#188818" font-family="monospace" font-size="8">SoftDOS v0.1</text>
  <!-- Power LED -->
  <circle cx="106" cy="98" r="2.5" fill="#33ff33"/>
  <!-- Monitor Stand Base -->
  <path d="M 44 106 L 84 106 L 90 118 L 38 118 Z" fill="#a8a494" stroke="#8e8a78" stroke-width="1.5"/>
</svg>
