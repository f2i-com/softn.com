<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Application</title>
    <link
      id="application-icon"
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        background: #171821;
        color: #f5f5f8;
        font-family: system-ui;
      }
      #boot {
        min-height: 100dvh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 16px;
      }
      .wheel {
        width: 32px;
        height: 32px;
        border: 3px solid #ffffff30;
        border-top-color: #f5f5f8;
        border-radius: 50%;
        animation: turn 0.8s linear infinite;
      }
      @keyframes turn {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .wheel {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status">
        <span class="wheel" aria-hidden="true"></span><span>Loading…</span>
      </div>
    </div>
    <noscript>This application needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
