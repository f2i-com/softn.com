name: Build SoftN

# The checks run on every push to main and every pull request against it: the
# engine this used to have to compile from a separate repository now lives at
# packages/@softn/core/wasm-zipp/, committed, so there is nothing to fetch and
# no reason for a merge to skip typecheck, lint and the test suites. The steps
# themselves are in verify.yml, shared with the release workflow. The
# desktop builds are the exception — six platform runners per push is a cost
# a typo does not justify — and stay behind the manual trigger, which still
# runs everything.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # The verification steps live in verify.yml, which the release workflow
  # calls as well, so a tag is held to exactly what a push is.
  check:
    name: Verify
    uses: ./.github/workflows/verify.yml

  build-web:
    name: Build Web Runtime
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: |
          npm run build:packages
          npm run build -w @softn/web
          npm run build -w @softn/single
          npm run package:single -- --with-backend
          npm run build -w @softn/single-php-serve
          npm run package:single-php-serve
          npm run package:private-single-php

      - name: Install Apache/PHP test dependencies
        run: sudo apt-get update && sudo apt-get install -y apache2 php-cli php-cgi php-gd

      - name: Verify the optional backend distribution
        run: |
          python3 scripts/test-single-backend.py --archive "$(ls release/softn-single-php-linux-x64-v*.zip)"
          python3 apps/softn-php/tests/apache-smoke.py --archive "$(ls release/softn-single-php-linux-x64-v*.zip)"
          python3 scripts/test-single-backend.py --private --archive "$(ls release/softn-private-single-php-linux-x64-v*.zip)"
          python3 apps/softn-php/tests/apache-smoke.py --private --archive "$(ls release/softn-private-single-php-linux-x64-v*.zip)"

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: softn-web
          path: apps/softn-web/dist/
          retention-days: 7

      - name: Upload single-app hosting ZIP
        uses: actions/upload-artifact@v4
        with:
          name: softn-single-hosting
          path: |
            release/softn-single-v*.zip
            release/softn-single-v*.zip.sha256
            release/softn-single-php-linux-x64-v*.zip
            release/softn-single-php-linux-x64-v*.zip.sha256
            release/softn-single-php-serve-v*.zip
            release/softn-single-php-serve-v*.zip.sha256
            release/softn-private-single-php-linux-x64-v*.zip
            release/softn-private-single-php-linux-x64-v*.zip.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  # The browser smoke gate (QA-01): the built site, runtime, Studio, Builder
  # and directory API served as one origin at their deployed paths, driven
  # by Playwright through the journeys the audit asked for — Studio and
  # Builder handing a bundle to the runtime and to the publish page without
  # the editor moving, publishing and keeping the edit key through a failed
  # lookup, the directory's search surviving back/forward. It runs after the
  # shared verification and in addition to it, never instead: the unit
  # suites stay where they are. Traces, screenshots and the pages' console
  # output are uploaded when a journey fails. See e2e/playwright.config.ts.
  e2e:
    name: Browser smoke gate
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The example bundles: the directory seeds itself from them and the
      # journeys open one in Studio and Builder.
      - name: Fetch the demo bundles
        run: npm run fetch:demos

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # The apps import @softn/core and @softn/components from dist/, and
      # build:site assembles everything the topology server serves.
      - name: Build packages
        run: npm run build:packages

      - name: Build the site with the example bundles
        run: SOFTN_WITH_DEMOS=1 npm run build:site

      # The same HTTP-level check the release runs, so a routing or header
      # regression is named here rather than as a browser timeout below.
      - name: Smoke-test the built site
        run: node scripts/smoke-site.mjs --root dist

      # The gate starts scripts/serve-topology.mjs itself (php -S on dist/
      # with the API's router and a disposable data directory) and waits for
      # its health endpoint. The runner image ships PHP.
      - name: Run the browser journeys
        run: npm run e2e
        env:
          CI: true

      - name: Upload traces, screenshots and console logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: softn-e2e-results
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  build-tauri:
    name: Build ${{ matrix.app }} (${{ matrix.platform }})
    needs: check
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: softn-loader
            platform: ubuntu-22.04
          - app: softn-loader
            platform: windows-latest
          - app: softn-loader
            platform: macos-latest
          - app: softn-builder
            platform: ubuntu-22.04
          - app: softn-builder
            platform: windows-latest
          - app: softn-builder
            platform: macos-latest
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned xdb.org dependency
        if: matrix.app == 'softn-loader'
        run: bash .github/scripts/checkout-xdb.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/${{ matrix.app }}/src-tauri/target/
          key: tauri-${{ matrix.app }}-${{ matrix.platform }}-${{ hashFiles('apps/**/Cargo.lock') }}
          restore-keys: tauri-${{ matrix.app }}-${{ matrix.platform }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:packages

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/${{ matrix.app }}
          # Skip Tauri's built-in DMG bundling on macOS — bundle_dmg.sh fails
          # on headless CI runners. We create the DMG manually in the next step.
          args: ${{ startsWith(matrix.platform, 'macos') && '--bundles app' || '' }}

      - name: Create DMG (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          APP_DIR="apps/${{ matrix.app }}/src-tauri/target/release/bundle/macos"
          DMG_DIR="apps/${{ matrix.app }}/src-tauri/target/release/bundle/dmg"
          mkdir -p "$DMG_DIR"
          APP_PATH=$(find "$APP_DIR" -maxdepth 1 -name "*.app" | head -1)
          APP_NAME=$(basename "$APP_PATH" .app)
          hdiutil create -volname "$APP_NAME" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_DIR/$APP_NAME.dmg"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ matrix.platform }}
          path: |
            apps/${{ matrix.app }}/src-tauri/target/release/bundle/**/*.exe
            apps/${{ matrix.app }}/src-tauri/target/release/bundle/**/*.msi
            apps/${{ matrix.app }}/src-tauri/target/release/bundle/**/*.dmg
            apps/${{ matrix.app }}/src-tauri/target/release/bundle/**/*.AppImage
            apps/${{ matrix.app }}/src-tauri/target/release/bundle/**/*.deb
          retention-days: 7
