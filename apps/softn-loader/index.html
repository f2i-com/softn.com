<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101317" />
    <!--
      Runs before the first paint so a reader never sees the wrong ground flash
      first. The same script, with the same key, is in every SoftN app's
      index.html; @softn/brand's theme.ts is the copy to check against.
    -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('softn.site.theme');
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            theme = 'light';
          }
        } catch (e) {
          /* Storage blocked; the dark default stands. */
        }
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#f4f6f9' : '#101317');
      })();
    </script>
    <title>Softn — Desktop runtime</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: var(--ink, #101317);
        color: var(--paper, #f2f0ec);
        overflow: hidden;
      }
      #root {
        width: 100%;
        height: 100%;
        min-height: 100%;
        background: var(--ink, #101317);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
