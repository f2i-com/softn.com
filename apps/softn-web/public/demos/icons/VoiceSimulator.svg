<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="65%">
      <stop offset="0%" stop-color="#17243b"/>
      <stop offset="65%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#060a13"/>
    </radialGradient>
    <linearGradient id="lipTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f47c85"/>
      <stop offset="55%" stop-color="#d94e5a"/>
      <stop offset="100%" stop-color="#a83242"/>
    </linearGradient>
    <linearGradient id="lipBot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c43b4c"/>
      <stop offset="45%" stop-color="#ec6e79"/>
      <stop offset="100%" stop-color="#b63746"/>
    </linearGradient>
    <linearGradient id="waveCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="throat" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#22070d"/>
      <stop offset="100%" stop-color="#4d111d"/>
    </radialGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Formant Acoustic Resonance Rings -->
  <ellipse cx="64" cy="64" rx="52" ry="39" fill="none" stroke="url(#waveCyan)" stroke-width="1.6" stroke-opacity="0.28" stroke-dasharray="6 5"/>
  <ellipse cx="64" cy="64" rx="45" ry="32" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.42"/>

  <!-- Oral Cavity Interior -->
  <path d="M 20 63 Q 42 46 64 48 Q 86 46 108 63 Q 88 86 64 87 Q 40 86 20 63 Z" fill="url(#throat)"/>

  <!-- Upper Teeth Arch -->
  <path d="M 33 56 Q 64 52 95 56 L 92 63 Q 64 60 36 63 Z" fill="#f5f0e4"/>
  <!-- Uvula & Tongue -->
  <path d="M 61 55 Q 64 64 67 55 Z" fill="#cf4656"/>
  <ellipse cx="64" cy="79" rx="22" ry="9.5" fill="#e05b6b"/>
  <path d="M 64 71 L 64 85" stroke="#b83b4c" stroke-width="1.5" stroke-linecap="round" opacity="0.65"/>
  <!-- Lower Teeth Arch -->
  <path d="M 38 78 Q 64 81 90 78 L 88 83 Q 64 86 40 83 Z" fill="#efe9da"/>

  <!-- Sculpted Upper Lip with Cupid's Bow -->
  <path d="M 16 63 C 26 50, 42 39, 54 41 C 59 42, 61.5 45.5, 64 45.5 C 66.5 45.5, 69 42, 74 41 C 86 39, 102 50, 112 63 C 96 57, 80 54, 69 56 C 66 56.6, 62 56.6, 59 56 C 48 54, 32 57, 16 63 Z" fill="url(#lipTop)"/>
  <!-- Cupid's Bow White-Roll Highlight -->
  <path d="M 34 48 Q 51 40 56 42.5 Q 64 46.5 72 42.5 Q 77 40 94 48" fill="none" stroke="#ffd5d9" stroke-width="1.4" stroke-linecap="round" opacity="0.65"/>

  <!-- Sculpted Lower Lip Cushion -->
  <path d="M 16 63 C 33 74, 46 77, 64 77 C 82 77, 95 74, 112 63 C 101 82, 84 94, 64 94 C 44 94, 27 82, 16 63 Z" fill="url(#lipBot)"/>
  <!-- Wet Lower Lip Specular Glint -->
  <path d="M 46 84 Q 64 88 82 84" fill="none" stroke="#ffe4e7" stroke-width="2.4" stroke-linecap="round" opacity="0.55"/>

  <!-- Acoustic Waveform Pulse Overlay at Bottom -->
  <path d="M 34 108 L 44 108 L 49 101 L 55 113 L 61 98 L 67 114 L 73 102 L 78 108 L 94 108" fill="none" stroke="url(#waveCyan)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
