<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101317" />
    <meta name="description" content="SoftN Studio — Design and generate SoftN applications in the browser" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- The apple- prefixed form is the deprecated spelling, kept because iOS Safari still
         only honours that one for standalone display. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>SoftN Studio</title>
    <style>
      *, *::before, *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body, #root {
        height: 100%;
        overflow: hidden;
        font-family: var(--studio-body, 'IBM Plex Sans', system-ui, -apple-system, sans-serif);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      body {
        background: var(--studio-bg, #101317);
        color: var(--studio-text, #f2f0ec);
        transition: background 0.2s ease, color 0.2s ease;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
