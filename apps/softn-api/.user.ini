; PHP settings for the directory API, read per directory by PHP-FPM and CGI
; hosts (the common shared-hosting setups). A bundle can be up to 32 MB and
; a JSON body carrying one in base64 a third larger, so both limits sit above
; that. mod_php hosts read php_value lines from .htaccess instead; if uploads
; of large bundles fail with "larger than this server accepts", raise these
; wherever this host reads them.
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 120
